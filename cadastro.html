<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;700&display=swap">
    <title>Cadastro</title>
</head>
<body>
    <header style="border-bottom: 1px solid #9aa3b52d;">
        <div class="container-principal">
            <nav class="nav-inicio">
                <ul class="lista">
                    <a href="index.html"><li class="titulo-nav">FPS <b style="color: #FF4655;">/ </b>MINHA HISTÓRIA</li></a>
                </ul>
            </nav>
        </div>
    </header>

    <section class="section-formulario container-principal">

        <div class="painel-formulario">
            <img src="img/mira.png" alt="" class="img-painel">
            <h2 class="h2-painel">Crie sua conta</h2>
            <p class="p-painel">Cadastre-se para acompanhar as estatísticas e o dashboard completo.</p>
        </div>

        <div class="conteudo-formulario">
            <div class="card-formulario">
                <p class="p-formulario">CADASTRO</p>
                <h1 class="h1-formulario">Criar conta</h1>
                <p class="p-descricao-formulario">Preencha os dados abaixo para começar.</p>

                <div class="campo-formulario">
                    <label for="nome" class="label-formulario">Nome</label>
                    <input type="text" id="nome" class="input-formulario" placeholder="Seu nome">
                </div>

                <div class="campo-formulario">
                    <label for="email" class="label-formulario">E-mail</label>
                    <input type="email" id="email" class="input-formulario" placeholder="exemplo@email.com">
                </div>

                <div class="campo-formulario">
                    <label for="nick" class="label-formulario">Nickname</label>
                    <input type="text" id="nick" class="input-formulario" placeholder="Seu nick do valorant">
                </div>

                <div class="campo-formulario">
                    <label for="senha" class="label-formulario">Senha</label>
                    <input type="password" id="senha" class="input-formulario" placeholder="Crie uma senha">
                </div>

                <div class="campo-formulario">
                    <label for="confirmar-senha" class="label-formulario">Confirmar senha</label>
                    <input type="password" id="confirmar-senha" class="input-formulario" placeholder="Repita a senha">
                </div>

                <button class="botao-formulario">Criar conta</button>

                <p class="p-rodape-formulario">Já tem conta? <a href="login.html" class="link-formulario">Entrar</a></p>
            </div>
        </div>

    </section>
</body>
</html>
