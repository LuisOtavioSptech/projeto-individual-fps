<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;700&display=swap">
    <title>Cadastro</title>
</head>
<body>
    <header style="border-bottom: 1px solid #9aa3b52d;">
        <div class="container-principal">
            <nav class="nav-inicio">
                <ul class="lista">
                    <a href="index.html"><li class="titulo-nav">FPS <b style="color: #FF4655;">/ </b>MINHA HISTÓRIA</li></a>
                </ul>
            </nav>
        </div>
    </header>

    <section class="section-formulario container-principal">

        <div class="painel-formulario">
            <img src="assets/imgs/mira.png" alt="" class="img-painel">
            <h2 class="h2-painel">Crie sua conta</h2>
            <p class="p-painel">Cadastre-se para acompanhar as estatísticas e o dashboard completo.</p>
        </div>

        <div class="conteudo-formulario">
            <div class="card-formulario">
                <p class="p-formulario">CADASTRO</p>
                <h1 class="h1-formulario">Criar conta</h1>
                <p class="p-descricao-formulario">Preencha os dados abaixo para começar.</p>

                <div class="campo-formulario">
                    <label for="nome" class="label-formulario">Nome</label>
                    <input type="text" id="input_nome" class="input-formulario" placeholder="Seu nome">
                </div>

                <div class="campo-formulario">
                    <label for="email" class="label-formulario">E-mail</label>
                    <input type="email" id="input_email" class="input-formulario" placeholder="exemplo@email.com">
                </div>

                <div class="campo-formulario">
                    <label for="senha" class="label-formulario">Senha</label>
                    <input type="password" id="input_senha" class="input-formulario" placeholder="Crie uma senha">
                </div>

                <div class="campo-formulario">
                    <label for="confirmar-senha" class="label-formulario">Confirmar senha</label>
                    <input type="password" id="input_confirmarSenha" class="input-formulario" placeholder="Repita a senha">
                </div>

                <button class="botao-formulario" onclick="cadastrar()">Criar conta</button>

                <p class="p-rodape-formulario">Já tem conta? <a href="login.html" class="link-formulario">Entrar</a></p>
            </div>
        </div>

    </section>
</body>
</html>

<script>
    function cadastrar() {

        let nome = input_nome.value;
        let email = input_email.value;
        let senha = input_senha.value;
        let confirmarSenha = input_confirmarSenha.value;

        if (nome == "") {
            alert("O nome é obrigatório.");
            input_nome.focus();
            return;
        }

        if (email == "") {
            alert("O e-mail é obrigatório.");
            input_email.focus();
            return;
        }

        if (!email.includes("@") || !email.includes(".")) {
            alert("Digite um e-mail válido.");
            input_email.focus();
            return;
        }


        if (senha == "") {
            alert("A senha é obrigatória.");
            input_senha.focus();
            return;
        }

        if (senha.length < 8) {
            alert("A senha deve conter pelo menos 8 caracteres.");
            input_senha.focus();
            return;
        }

        if (confirmarSenha == "") {
            alert("Confirme sua senha.");
            input_confirmarSenha.focus();
            return;
        }

        if (senha != confirmarSenha) {
            alert("As senhas não coincidem.");
            input_confirmarSenha.focus();
            return;
        }

        fetch("/usuarios/cadastrar", {
            method: "POST",
            headers: {
            "Content-Type": "application/json",
        },
            body: JSON.stringify({
            // crie um atributo que recebe o valor recuperado aqui
            // Agora vá para o arquivo routes/usuario.js
            nomeServer: nome,
            emailServer: email,
            senhaServer: senha,
      }),
    }).then(function (resposta) {
            if (resposta.ok) {
            alert("Cadastro realizado com sucesso! Redirecionando para o login...");
            setTimeout(() => {
            window.location = "login.html";
                }, 1000);
            } else {
            throw "Houve um erro ao tentar realizar o cadastro!";
            }
        })
        .catch(function (erro) {
        console.log(`#ERRO: ${erro}`);
        });

        alert("Cadastro realizado com sucesso!");
    }
</script>
