<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;700&display=swap">
    <title>Login</title>
</head>
<body>
    <header style="border-bottom: 1px solid #9aa3b52d;">
        <div class="container-principal">
            <nav class="nav-inicio">
                <ul class="lista">
                    <a href="index.html"><li class="titulo-nav">FPS <b style="color: #FF4655;">/</b> MINHA HISTÓRIA</li></a>
                </ul>
            </nav>
        </div>
    </header>

    <section class="section-formulario container-principal">

        <div class="painel-formulario">
            <img src="img/mira.png" alt="" class="img-painel">
            <h2 class="h2-painel">Bem-vindo de volta</h2>
            <p class="p-painel">Entre na sua conta para acessar o dashboard completo.</p>
        </div>

        <div class="conteudo-formulario">
            <div class="card-formulario">
                <p class="p-formulario">LOGIN</p>
                <h1 class="h1-formulario">Entrar na conta</h1>
                <p class="p-descricao-formulario">Use o e-mail e a senha do seu cadastro.</p>

                <div class="campo-formulario">
                    <label for="email" class="label-formulario">E-mail</label>
                    <input type="email" id="input_email" class="input-formulario" placeholder="exemplo@email.com">
                </div>

                <div class="campo-formulario" style="margin-bottom: 12px;">
                    <label for="senha" class="label-formulario">Senha</label>
                    <input type="password" id="input_senha" class="input-formulario" placeholder="Digite sua senha">
                </div>

                <div class="linha-esqueci">
                    <a href="#" class="link-formulario">Esqueci minha senha</a>
                </div>

                <button class="botao-formulario" onclick="validarLogin()">Entrar</button>

                <p class="p-rodape-formulario">Ainda não tem conta? <a href="cadastro.html" class="link-formulario">Criar conta</a></p>
            </div>
        </div>

    </section>
</body>
</html>

<script>

    function validarLogin() {

        let email = input_email.value;
        let senha = input_senha.value;

        if (email == "") {
            alert("O e-mail é obrigatório.");
            input_email.focus();
            return;
        }

        if (!email.includes("@") || !email.includes(".")) {
            alert("Digite um e-mail válido.");
            input_email.focus();
            return;
        }

        if (senha == "") {
            alert("A senha é obrigatória.");
            input_senha.focus();
            return;
        }

        if (senha.length < 8) {
            alert("A senha deve conter pelo menos 8 caracteres.");
            input_senha.focus();
            return;
        }

        alert("Login realizado com sucesso!");
    }
</script>
